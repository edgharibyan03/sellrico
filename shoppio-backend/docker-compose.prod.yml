services:
  postgres:
    image: postgres:16-alpine
    container_name: shoppio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoppio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shoppio}
    volumes:
      - shoppio_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shoppio

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppio-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-shoppio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shoppio}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - shoppio

networks:
  shoppio:
    driver: bridge

volumes:
  shoppio_pg_data:
